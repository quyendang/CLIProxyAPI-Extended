host: ""

port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: true
  secret-key: "123456"
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

auth-dir: "~/.cli-proxy-api"

# API key dùng để gọi /v1/*
# HÃY ĐỔI KEY NÀY
api-keys:
  - "sk-173e1dadc4ebb2ce-v4m1xl-d8b35119"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

commercial-mode: false

incognito-browser: true

logging-to-file: false

logs-max-total-size-mb: 0
error-logs-max-files: 10

usage-statistics-enabled: true

show-provider-prefixes: true

redis-usage-queue-retention-seconds: 60

proxy-url: ""

force-model-prefix: false

passthrough-headers: false

request-retry: 3

max-retry-credentials: 0

max-retry-interval: 30

disable-cooling: false

disable-image-generation: false

quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true

routing:
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "1h"

ws-auth: false

disable-auth: false

use-canonical-translator: true

enable-gemini-cli-endpoint: false

nonstream-keepalive-interval: 0

# Giữ kết nối streaming ổn định hơn trên Railway
streaming:
  keepalive-seconds: 15
  bootstrap-retries: 1

# ==============================
# KIRO
# ==============================
#
# Không cần cấu hình tại đây nếu bạn login/import account
# thông qua Management Web UI.
#
# Ví dụ nếu muốn cấu hình trực tiếp:
#
# kiro:
#   - access-token: "..."
#     refresh-token: "..."
#     profile-arn: "arn:aws:codewhisperer:us-east-1:..."
#     region: "us-east-1"

# ==============================
# GEMINI API KEY - OPTIONAL
# ==============================
